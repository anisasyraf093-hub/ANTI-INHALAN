.new{color:#6fe39a;font-weight:700;clear:both}.bad{color:#ffb199}.good{color:#6fe39a}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:12px;background:radial-gradient(circle,rgba(12,14,60,.5),rgba(3,4,20,.92))}
body.play #start{display:none}
#start h1{margin:0;font-size:clamp(26px,6vw,52px);color:#ffd54a;text-shadow:0 4px 0 #7a5a00,0 0 24px #a77bff;line-height:1.05}
#start h2{margin:2px 0 12px;font-size:clamp(14px,3vw,22px);color:#a8e6ff}.sub{margin:0;color:#c9b8ff;font-weight:700}
.big{font-size:22px;padding:12px 30px}

{f:'Rakan: "Semua orang buat! Kau penakut ke?"',tip:'Beredar dari situasi berbahaya dengan tenang.',

['Antara berikut, yang manakah mungkin mengandungi bahan inhalan?',['Thinner cat','Air minuman','Nasi'],0,'Thinner cat mengeluarkan wap kimia yang berbahaya.'],
['Petrol ialah bahan yang...',['Selamat untuk dihidu','Mudah meruap dan wapnya berbahaya','Makanan haiwan'],1,'Petrol mudah meruap dan wapnya berbahaya.'],
['Adakah semua gam mempunyai kandungan yang sama?',['Ya, semua sama','Tidak, hanya sesetengah mengandungi pelarut','Gam boleh diminum'],1,'Hanya sesetengah gam mengandungi pelarut.'],
['Produk aerosol patut digunakan oleh siapa?',['Orang dewasa mengikut label','Kanak-kanak sebagai mainan','Murid ke muka rakan'],0,'Aerosol perlu digunakan mengikut label oleh orang dewasa.'],

['Jika penyalahgunaan sangat teruk, apa yang boleh berlaku?',['Pengsan dan bahaya maut','Menjadi lebih tinggi','Cepat pandai'],0,'Seseorang boleh pengsan dan boleh membawa maut.'],

['Siapakah yang boleh membantu kita?',['Guru atau ibu bapa','Orang yang tidak dikenali','Tiada siapa'],0,'Guru, ibu bapa dan orang dewasa yang dipercayai boleh membantu.']];

const R={
lobi:{n:'Lobi Misteri',w:22,h:14,a:['#1c2160','#252b78'],wl:'#0b0d2e',ac:'#f2c94c',

 O:[['rug',8,5,'6x4'],['npc',11,4,'guard'],['board',6,2,''],['map',15,2,''],['chest',19,11,'cl0'],['plant',1,1],['plant',20,1],['plant',1,12],['plant',20,12],['lamp',8,1],['lamp',13,1],['bench',4,8],['bench',16,8],['table',2,5],['table',19,5]]},
B:{n:'Galeri Kenali Bahan Inhalan',w:16,h:11,a:['#1d5c63','#246b73'],wl:'#10333a',ac:'#f5d33f',
 D:[[8,10,'lobi',3,1,'Lobi']],
 O:[['rug',5,4,'6x3'],['ex',3,3,'gam'],['ex',12,3,'petrol'],['ex',3,7,'thinner'],['ex',12,7,'aerosol'],['shelf',6,1],['shelf',9,1],['plant',1,1],['plant',14,1],['lamp',4,1],['lamp',11,1],['clue',14,9,'cl1']]},
C:{n:'Galeri Kesan Terhadap Kesihatan',w:18,h:12,a:['#5a2a4a','#6b3350'],wl:'#2a1126',ac:'#ff8a5c',
 D:[[9,11,'lobi',10,1,'Lobi']],
 O:[['rug',6,5,'6x2'],['st',3,3,'kepala'],['st',8,3,'perut'],['st',13,3,'paru'],['st',3,7,'otak'],['st',8,7,'organ'],['st',13,7,'pengsan'],['plant',1,1],['plant',16,1],['lamp',6,1],['lamp',11,1],['clue',16,10,'cl2']]},
D:{n:'Bilik Simulasi Berani Berkata TIDAK',w:14,h:10,a:['#1f7a5a','#2a8c6a'],wl:'#10402f',ac:'#e8fff5',
 D:[[7,9,'lobi',17,1,'Lobi']],
 O:[['rug',4,3,'6x3'],['friend',7,3,'f'],['table',3,6],['table',10,6],['plant',1,1],['plant',12,1],['lamp',4,1],['lamp',9,1],['clue',1,8,'cl3']]},
E:{n:'Bilik Kuiz Akhir',w:14,h:10,a:['#3a2a8c','#4636a5'],wl:'#161040',ac:'#ffd54a',
 D:[[7,9,'lobi',10,12,'Lobi']],
 O:[['rug',4,4,'6x3'],['quizm',7,3,'q'],['score',3,2,''],['plant',1,1],['plant',12,1],['lamp',5,1],['lamp',9,1],['plant',1,8],['plant',12,8]]}};
const SOL=new Set(['plant','lamp','bench','shelf','table','npc','friend','quizm','board','map','chest','ex','st','score']);
const IT=new Set(['npc','friend','quizm','board','map','chest','ex','st','clue','score']);
const fresh=()=>({room:'lobi',k:{ex:[],st:[],sc:[],cl:[]},b:[],q:0,qs:0,talk:0});
let S=fresh(),room,objs,solids,cam={x:0,y:0},P={x:0,y:0,d:2,m:0},K={},vk={},mode='menu',modal=false,fx=[],time=0,near=null,AC,snd=true,mi,stepT=0,fade=0,banner=0,pv={x:0,y:0},tcd=0;
function loadRoom(id,sx,sy){room=R[id];S.room=id;objs=room.O;solids=new Set(objs.filter(o=>SOL.has(o[0])).map(o=>o[1]+','+o[2]));P.x=sx*T+16;P.y=sy*T+16;pv.x=P.x;pv.y=P.y;banner=3;fade=1}
const doorAt=(x,y)=>room.D.find(d=>d[0]==x&&d[1]==y);
function isSolid(x,y){if(x<0||y<0||x>=room.w||y>=room.h)return true;if((x==0||y==0||x==room.w-1||y==room.h-1)&&!doorAt(x,y))return true;return solids.has(x+','+y)}
const hit=(x,y)=>[[-8,-3],[8,-3],[-8,8],[8,8]].some(([a,b])=>isSolid(Math.floor((x+a)/T),Math.floor((y+b)/T)));
const total=()=>S.k.ex.length+S.k.st.length+S.k.sc.length,unlocked=()=>total()>=13;

let best=null,bd=46;objs.forEach(o=>{if(!IT.has(o[0]))return;if(o[0]=='clue'&&S.k.cl.includes(o[3]))return;const dd=Math.hypot(P.x-o[1]*T-16,P.y-o[2]*T-16);if(dd<bd){bd=dd;best=o}});near=best;
const p=$('prompt');if(best){p.textContent=best[0]=='quizm'&&!unlocked()?'Terkunci':(matchMedia('(pointer:coarse)').matches?'Tekan butang E':'Tekan E')+(best[0]=='npc'||best[0]=='friend'||best[0]=='quizm'?' untuk bercakap':' untuk menyiasat');p.classList.remove('hide')}else p.classList.add('hide')}
